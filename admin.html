<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Menu Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            padding: 15px;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { margin-bottom: 15px; text-align: center; }
        .flavor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }
        .flavor-name { font-size: 1.2rem; font-weight: 600; text-transform: capitalize; }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2ec4b6; }
        input:checked + .slider:before { transform: translateX(26px); }
        #pin-overlay {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }
        input[type="password"] {
            padding: 12px; font-size: 1.2rem; text-align: center; border: 1px solid #ccc; border-radius: 6px;
        }
        button {
            padding: 12px; font-size: 1.1rem; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- PIN Auth Screen -->
        <div id="pin-overlay">
            <h2>Staff Access</h2>
            <input type="password" id="pin-input" placeholder="Enter PIN Code">
            <button onclick="checkPin()">Login</button>
        </div>

        <!-- Control Panel Screen -->
        <div id="admin-panel" style="display: none;">
            <h2>Flavor Availability</h2>
            <div id="flavor-list">Loading flavors...</div>
        </div>
    </div>

    <script>
        let currentPin = "";

        async function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (!input) return;

            // Attempt a test load of flavors to verify PIN authorization via RPC test call
            currentPin = input;
            const success = await loadFlavors();
            
            if (success) {
                sessionStorage.setItem('staff_pin', currentPin);
                document.getElementById('pin-overlay').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                currentPin = "";
                alert('Incorrect PIN code');
            }
        }

        async function loadFlavors() {
            const { data: flavors, error } = await supabaseClient
                .from('flavors')
                .select('*')
                .order('name');

            if (error) {
                return false;
            }

            const container = document.getElementById('flavor-list');
            container.innerHTML = '';

            flavors.forEach(flavor => {
                const row = document.createElement('div');
                row.className = 'flavor-row';
                row.innerHTML = `
                    <span class="flavor-name">${flavor.name}</span>
                    <label class="switch">
                        <input type="checkbox" ${flavor.in_stock ? 'checked' : ''} onchange="toggleFlavor('${flavor.id}', this.checked, this)">
                        <span class="slider"></span>
                    </label>
                `;
                container.appendChild(row);
            });
            return true;
        }

        async function toggleFlavor(id, inStock, checkboxElement) {
            // Call the secure Supabase function (RPC) passing the PIN for server-side verification
            const { data, error } = await supabaseClient.rpc('toggle_flavor_with_pin', {
                flavor_id: id,
                new_stock_status: inStock,
                input_pin: currentPin
            });

            if (error) {
                alert('Security Error: ' + error.message);
                // Revert checkbox state if unauthorized
                checkboxElement.checked = !inStock;
            }
        }

        // Check if PIN was previously entered in this browser session
        const savedPin = sessionStorage.getItem('staff_pin');
        if (savedPin) {
            document.getElementById('pin-input').value = savedPin;
            checkPin();
        }
    </script>
</body>
</html>
