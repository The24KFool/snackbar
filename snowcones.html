<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowcone Menu</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-muted: #cbd5e1;
            --out-bg: #f8fafc;
            --pill-bg: #fef2f2;
            --pill-border: #fca5a5;
            --pill-text: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem;
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 0.75rem;
        }

        .header h1 {
            margin: 0;
            font-size: 2.25rem;
            color: var(--primary);
            letter-spacing: 0.02em;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-column {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .column-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Compact Flavor Row Layout */
        .flavor-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 0.85rem;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            transition: opacity 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .flavor-card:last-child {
            margin-bottom: 0;
        }

        .flavor-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .flavor-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .flavor-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Compact Out-of-Stock Treatment */
        .flavor-card.out-of-stock {
            opacity: 0.5;
            background-color: var(--out-bg);
            border-color: var(--border-muted);
        }

        .flavor-card.out-of-stock .flavor-name {
            color: var(--text-muted);
        }

        /* Minimalist Inline Status Pill */
        .sold-out-pill {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--pill-text);
            background-color: var(--pill-bg);
            border: 1px solid var(--pill-border);
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            margin-left: 0.5rem;
        }

        .loading-text {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍧 Shaved Ice Menu</h1>
    </div>

    <div class="menu-grid">
        <!-- Single Flavors Column -->
        <div class="menu-column">
            <h2 class="column-title">Single Flavors</h2>
            <div id="single-flavors-container">
                <span class="loading-text">Loading flavors...</span>
            </div>
        </div>

        <!-- Flavor Combinations Column -->
        <div class="menu-column">
            <h2 class="column-title">Popular Combos</h2>
            <div id="combo-flavors-container">
                <span class="loading-text">Loading combinations...</span>
            </div>
        </div>
    </div>

    <script>
        let flavorsData = [];
        let combosData = [];

        async function fetchMenuData() {
            // Fetch single flavors
            const { data: flavors, error: flavorsErr } = await supabaseClient
                .from('flavors')
                .select('*')
                .order('name', { ascending: true });

            if (!flavorsErr && flavors) {
                flavorsData = flavors;
            }

            // Fetch flavor combos
            const { data: combos, error: combosErr } = await supabaseClient
                .from('flavor_combos')
                .select('*')
                .order('name', { ascending: true });

            if (!combosErr && combos) {
                combosData = combos;
            }

            renderMenu();
        }

        function renderMenu() {
            renderSingleFlavors();
            renderComboFlavors();
        }

        function renderSingleFlavors() {
            const container = document.getElementById('single-flavors-container');
            if (!flavorsData || flavorsData.length === 0) {
                container.innerHTML = '<p class="loading-text">No single flavors available.</p>';
                return;
            }

            container.innerHTML = flavorsData.map(flavor => {
                const isInStock = flavor.in_stock;
                return `
                    <div class="flavor-card ${!isInStock ? 'out-of-stock' : ''}">
                        <div class="flavor-info">
                            <span class="flavor-name">${escapeHtml(flavor.name)}</span>
                        </div>
                        ${!isInStock ? '<span class="sold-out-pill">OUT OF STOCK</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function renderComboFlavors() {
            const container = document.getElementById('combo-flavors-container');
            if (!combosData || combosData.length === 0) {
                container.innerHTML = '<p class="loading-text">No combinations available.</p>';
                return;
            }

            // Map flavor stock status for quick lookup if combo availability depends on single flavors
            const stockMap = new Map(flavorsData.map(f => [f.id, f.in_stock]));

            container.innerHTML = combosData.map(combo => {
                // If combo has explicit in_stock column OR relies on ingredient IDs
                let isInStock = combo.in_stock !== undefined ? combo.in_stock : true;

                // Optional: Check if any referenced flavor component is out of stock
                if (Array.isArray(combo.flavor_ids) && combo.flavor_ids.length > 0) {
                    const allComponentsAvailable = combo.flavor_ids.every(id => stockMap.get(id) !== false);
                    isInStock = isInStock && allComponentsAvailable;
                }

                return `
                    <div class="flavor-card ${!isInStock ? 'out-of-stock' : ''}">
                        <div class="flavor-info">
                            <span class="flavor-name">${escapeHtml(combo.name)}</span>
                            ${combo.description ? `<span class="flavor-desc">${escapeHtml(combo.description)}</span>` : ''}
                        </div>
                        ${!isInStock ? '<span class="sold-out-pill">OUT OF STOCK</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function setupRealtimeSubscriptions() {
            // Subscribe to live updates from the flavors table
            supabaseClient
                .channel('public:flavors')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'flavors' }, () => {
                    fetchMenuData();
                })
                .subscribe();

            // Subscribe to live updates from the flavor_combos table
            supabaseClient
                .channel('public:flavor_combos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'flavor_combos' }, () => {
                    fetchMenuData();
                })
                .subscribe();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchMenuData();
            setupRealtimeSubscriptions();
        });
    </script>
</body>
</html>
