<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Cone Menu</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 3rem;
            color: var(--accent);
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-section {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
        }

        .section-title {
            font-size: 1.75rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-name {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
        }

        .combo-ingredients {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍧 Shaved Ice Menu</h1>
    </div>

    <!-- Single Flavors Section -->
    <div class="menu-section">
        <h2 class="section-title">Single Flavors</h2>
        <div id="single-flavors-grid" class="grid">
            <p style="color: var(--text-muted);">Loading single flavors...</p>
        </div>
    </div>

    <!-- Flavor Combinations Section -->
    <div class="menu-section">
        <h2 class="section-title">Flavor Combinations</h2>
        <div id="combos-grid" class="grid">
            <p style="color: var(--text-muted);">Loading flavor combinations...</p>
        </div>
    </div>

    <script>
        async function fetchMenuData() {
            try {
                // 1. Fetch available single flavors
                const { data: flavors, error: flavorError } = await supabaseClient
                    .from('flavors')
                    .select('*')
                    .eq('in_stock', true)
                    .order('name', { ascending: true });

                if (flavorError) {
                    console.error('Error loading flavors:', flavorError);
                    return;
                }

                renderSingleFlavors(flavors || []);

                // Build lookup Map and Set for ID normalization and stock checks
                const flavorMap = new Map((flavors || []).map(f => [f.id.toLowerCase(), f.name]));
                const inStockIds = new Set((flavors || []).map(f => f.id.toLowerCase()));

                // 2. Fetch all flavor combos
                const { data: combos, error: comboError } = await supabaseClient
                    .from('flavor_combos')
                    .select('*')
                    .order('name', { ascending: true });

                if (comboError) {
                    console.error('Error loading combos:', comboError);
                    return;
                }

                // 3. Dynamically filter combos where ALL ingredients are in stock
                const availableCombos = (combos || []).filter(combo => {
                    let ingredients = combo.ingredients;
                    if (typeof ingredients === 'string') {
                        try { ingredients = JSON.parse(ingredients); } catch (e) { ingredients = []; }
                    }
                    if (!Array.isArray(ingredients) || ingredients.length === 0) return false;

                    return ingredients.every(flavorId => inStockIds.has(String(flavorId).toLowerCase()));
                });

                renderCombos(availableCombos, flavorMap);

            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        function renderSingleFlavors(flavors) {
            const grid = document.getElementById('single-flavors-grid');
            if (flavors.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">No single flavors currently available.</p>';
                return;
            }

            grid.innerHTML = flavors.map(item => `
                <div class="card">
                    <h3 class="item-name">${escapeHtml(item.name)}</h3>
                </div>
            `).join('');
        }

        function renderCombos(combos, flavorMap) {
            const grid = document.getElementById('combos-grid');
            if (combos.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">No flavor combinations currently available.</p>';
                return;
            }

            grid.innerHTML = combos.map(item => {
                let ingredients = item.ingredients;
                if (typeof ingredients === 'string') {
                    try { ingredients = JSON.parse(ingredients); } catch (e) { ingredients = []; }
                }

                // Format ingredient names nicely
                const formattedList = Array.isArray(ingredients) 
                    ? ingredients.map(id => flavorMap.get(String(id).toLowerCase()) || id).join(' + ')
                    : '';

                return `
                    <div class="card">
                        <h3 class="item-name">${escapeHtml(item.name)}</h3>
                        ${formattedList ? `<div class="combo-ingredients">${escapeHtml(formattedList)}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial Load
        fetchMenuData();

        // Subscribe to Realtime WebSocket Updates on flavors
        supabaseClient
            .channel('public-menu-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'flavors' }, () => fetchMenuData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'flavor_combos' }, () => fetchMenuData())
            .subscribe();
    </script>
</body>
</html>
