<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowcone Menu</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-cyan: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --pill-bg: #450a0a;
            --pill-border: #991b1b;
            --pill-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
        }

        /* Strict No-Scroll Screen Envelope */
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* App Outer Layout */
        .app-viewport {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1.25rem 2rem 1.75rem 2rem;
            gap: 0.75rem;
        }

        /* Centered Header Banner with Sponsor Lockup */
        .main-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            gap: 0.25rem;
        }

        .main-title {
            font-size: 3.5rem; /* Scaled up for 8-10 ft visibility */
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-main);
            margin: 0;
            line-height: 0.95;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .sponsor-lockup {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.15rem;
        }

        .sponsor-subtitle {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .sponsor-logo {
            max-height: 48px; /* Strict height limit to preserve vertical screen real estate */
            width: auto;
            object-fit: contain;
        }

        /* Main Content Split Viewport */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Side-by-side split */
            gap: 2rem;
            flex: 1;
            min-height: 0; /* Critical for container height constraining */
        }

        .section-container {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Scaled Header for Distance */
        .section-title {
            color: var(--accent-cyan);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0 0 0.75rem 0;
            padding-bottom: 0.35rem;
            border-bottom: 3px solid var(--accent-cyan);
            flex-shrink: 0;
        }

        /* 2 Columns per Section (4 columns total across screen) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: max-content;
            gap: 0.75rem;
            align-content: start;
            overflow: hidden;
        }

        /* High-Visibility Distance Cards */
        .flavor-card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 10px;
            padding: 0.7rem 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 58px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: opacity 0.2s ease, filter 0.2s ease;
        }

        .flavor-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        /* Large Bold Text for Distance */
        .flavor-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .combo-ingredients {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Out of Stock Modifier */
        .flavor-card.out-of-stock {
            opacity: 0.4;
            filter: grayscale(40%);
            border-color: #1e293b;
        }

        .flavor-card.out-of-stock .flavor-name,
        .flavor-card.out-of-stock .combo-ingredients {
            color: var(--text-muted);
        }

        /* High-Contrast Pill for Distance */
        .sold-out-pill {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--pill-text);
            background-color: var(--pill-bg);
            border: 1px solid var(--pill-border);
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            margin-left: 0.75rem;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .loading-text {
            color: var(--text-muted);
            font-style: italic;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- Header with Title and Logo -->
        <header class="main-header">
            <h1 class="main-title">SHAVED ICE</h1>
            <div class="sponsor-lockup">
                <span class="sponsor-subtitle">brought to you by</span>
                <img src="logo.png" alt="Company Logo" class="sponsor-logo">
            </div>
        </header>

        <!-- Menu Split Container -->
        <div class="content-grid">
            <!-- Single Flavors Section (Left Half) -->
            <div class="section-container">
                <h2 class="section-title">Single Flavors</h2>
                <div id="single-flavors-grid" class="card-grid">
                    <span class="loading-text">Loading single flavors...</span>
                </div>
            </div>

            <!-- Flavor Combinations Section (Right Half) -->
            <div class="section-container">
                <h2 class="section-title">Flavor Combinations</h2>
                <div id="combo-flavors-grid" class="card-grid">
                    <span class="loading-text">Loading combinations...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let flavorsData = [];
        let combosData = [];

        async function fetchMenuData() {
            // Fetch single flavors
            const { data: flavors, error: flavorsErr } = await supabaseClient
                .from('flavors')
                .select('*')
                .order('name', { ascending: true });

            if (!flavorsErr && flavors) {
                flavorsData = flavors;
            }

            // Fetch flavor combos
            const { data: combos, error: combosErr } = await supabaseClient
                .from('flavor_combos')
                .select('*')
                .order('name', { ascending: true });

            if (!combosErr && combos) {
                combosData = combos;
            }

            renderMenu();
        }

        function renderMenu() {
            renderSingleFlavors();
            renderComboFlavors();
        }

        function renderSingleFlavors() {
            const container = document.getElementById('single-flavors-grid');
            if (!flavorsData || flavorsData.length === 0) {
                container.innerHTML = '<span class="loading-text">No single flavors available.</span>';
                return;
            }

            container.innerHTML = flavorsData.map(flavor => {
                const isInStock = flavor.in_stock;
                return `
                    <div class="flavor-card ${!isInStock ? 'out-of-stock' : ''}">
                        <div class="flavor-info">
                            <span class="flavor-name">${escapeHtml(flavor.name)}</span>
                        </div>
                        ${!isInStock ? '<span class="sold-out-pill">OUT OF STOCK</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function renderComboFlavors() {
            const container = document.getElementById('combo-flavors-grid');
            if (!combosData || combosData.length === 0) {
                container.innerHTML = '<span class="loading-text">No combinations available.</span>';
                return;
            }

            // Maps for fast stock status and name checks
            const stockMap = new Map(flavorsData.map(f => [f.id, f.in_stock]));
            const nameMap = new Map(flavorsData.map(f => [f.id, f.name]));

            container.innerHTML = combosData.map(combo => {
                let isInStock = combo.in_stock !== undefined ? combo.in_stock : true;
                let ingredientsList = [];

                // Check flavor stock and build ingredient name list
                if (Array.isArray(combo.ingredients) && combo.ingredients.length > 0) {
                    const allComponentsInStock = combo.ingredients.every(id => stockMap.get(id) !== false);
                    isInStock = isInStock && allComponentsInStock;

                    ingredientsList = combo.ingredients
                        .map(id => nameMap.get(id))
                        .filter(Boolean);
                } else if (Array.isArray(combo.flavor_ids) && combo.flavor_ids.length > 0) {
                    const allComponentsInStock = combo.flavor_ids.every(id => stockMap.get(id) !== false);
                    isInStock = isInStock && allComponentsInStock;

                    ingredientsList = combo.flavor_ids
                        .map(id => nameMap.get(id))
                        .filter(Boolean);
                } else if (combo.description) {
                    ingredientsList = [combo.description];
                }

                const ingredientsText = ingredientsList.join(' + ');

                return `
                    <div class="flavor-card ${!isInStock ? 'out-of-stock' : ''}">
                        <div class="flavor-info">
                            <span class="flavor-name">${escapeHtml(combo.name)}</span>
                            ${ingredientsText ? `<span class="combo-ingredients">${escapeHtml(ingredientsText)}</span>` : ''}
                        </div>
                        ${!isInStock ? '<span class="sold-out-pill">OUT OF STOCK</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function setupRealtimeSubscriptions() {
            supabaseClient
                .channel('public:flavors')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'flavors' }, () => {
                    fetchMenuData();
                })
                .subscribe();

            supabaseClient
                .channel('public:flavor_combos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'flavor_combos' }, () => {
                    fetchMenuData();
                })
                .subscribe();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMenuData();
            setupRealtimeSubscriptions();
        });
    </script>
</body>
</html>
